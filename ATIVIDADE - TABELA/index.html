<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELA 01</title>
</head>
    <style>
        body {
            background-color: #eaf6ff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        h1 {
            color: #1d3557;
            margin-top: 40px;
            margin-bottom: 30px;
        }
        table {
            background-color: white;
            border: 2px solid #1d3557;
            border-collapse: collapse;
            table-layout: fixed;
            width: 900px;
            margin: auto;
            box-shadow: 0px 0px 10px #999;
        }
        th {
            background-color: #1d3557;
            color: white;
            height: 50px;
        }
        th, td {
            border: 1px solid #1d3557;
            width: 80px;
            height: 70px;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
        td {
            background-color: #f8fbff;
        }
        tr:hover td {
            background-color: #e0f2fe;
        }
    </style>
</head>
<body>
    <h1>Grade de Aula - UniFil</h1>
    <table>
        <tr>
            <th>Horário</th>
            <th>Seg</th>
            <th>Ter</th>
            <th>Qua</th>
            <th>Qui</th>
            <th>Sex</th>
        </tr>
        <tr>
            <td>19:00 às 20:30</td>
            <td>Cálculo Numérico</td>
            <td>Algoritmos e Estrutura de Dados</td>
            <td>Algoritmos e Estrutura de Dados</td>
            <td>Dev. Web</td>
            <td>Flex</td>
        </tr>
        <tr>
            <td>Intervalo</td>
            <td>Intervalo</td>
            <td>Intervalo</td>
            <td>Intervalo</td>
            <td>Intervalo</td>
            <td>Intervalo</td>
        </tr>
        <tr>
            <td>20:45 às 22:15</td>
            <td>Dev. Web</td>
            <td>Introdução à BD</td>
            <td>Introdução à BD</td>
            <td>P. I</td>
            <td>Flex</td>
        </tr>
    </table>
</body>
</html>
